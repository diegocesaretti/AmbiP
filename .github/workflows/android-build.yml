name: Android Debug APK

on:
  push:
    branches: [ main, feature/tv-source-architecture ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build projector + TV source debug APKs
        run: gradle --no-daemon :app:assembleDebug :tvsource:assembleDebug

      - name: Upload projector APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbiProjector-v0.14-dynamic-cloud
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android TV source APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbiP-TV-Source-v0.1
          path: tvsource/build/outputs/apk/debug/tvsource-debug.apk
          if-no-files-found: error
